<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doctors Query FMGE Academy — Admin Enrollments</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#152238}
header{background:#0b5cab;color:#fff;padding:22px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}header h1{margin:0;font-size:22px}header p{margin:5px 0 0;opacity:.85;font-size:13px}.wrap{max-width:1400px;margin:24px auto;padding:0 18px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.card{background:#fff;border:1px solid #e2e9f2;border-radius:14px;padding:17px;box-shadow:0 5px 18px rgba(20,45,75,.06)}.label{font-size:12px;color:#68788c;text-transform:uppercase;letter-spacing:.06em}.num{font-size:27px;font-weight:750;margin-top:5px}
.toolbar{background:#fff;border:1px solid #e2e9f2;border-radius:14px;padding:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{height:40px;border:1px solid #d5dfeb;border-radius:9px;padding:0 12px;font-size:14px}.toolbar input{min-width:280px;flex:1}.toolbar button{height:40px;border:0;border-radius:9px;padding:0 15px;background:#0b5cab;color:#fff;font-weight:650;cursor:pointer}.toolbar button.secondary{background:#eef4fb;color:#174b7a}
.tablebox{background:#fff;border:1px solid #e2e9f2;border-radius:14px;overflow:auto;box-shadow:0 5px 18px rgba(20,45,75,.06)}table{border-collapse:collapse;width:100%;min-width:1200px}th,td{padding:12px 13px;border-bottom:1px solid #edf1f5;text-align:left;font-size:13px;vertical-align:top}th{background:#f8fafc;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#617187;position:sticky;top:0}.status{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700}.confirmed{background:#e7f8ef;color:#137a45}.pending{background:#fff5d9;color:#8a6500}.failed{background:#ffe9e9;color:#a32929}.small{font-size:11px;color:#718096}.empty{padding:35px;text-align:center;color:#738096}.error{padding:14px;background:#fff0f0;color:#9d2222;border-radius:10px;margin-bottom:14px;display:none}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.wrap{padding:0 10px}}
</style>
</head>
<body>
<header><div><h1>Doctors Query FMGE Academy</h1><p>Secure Enrollment Dashboard</p></div><div id="updated" class="small" style="color:#dcecff"></div></header>
<div class="wrap">
<div id="error" class="error"></div>
<div class="cards"><div class="card"><div class="label">Total Enrollments</div><div id="total" class="num">—</div></div><div class="card"><div class="label">Confirmed</div><div id="confirmed" class="num">—</div></div><div class="card"><div class="label">Pending</div><div id="pending" class="num">—</div></div><div class="card"><div class="label">Captured Payments</div><div id="captured" class="num">—</div></div></div>
<div class="toolbar"><input id="search" placeholder="Search name, WhatsApp, email, university or Enrollment ID…"><select id="status"><option value="">All statuses</option><option value="confirmed">Confirmed</option><option value="pending">Pending</option></select><button onclick="load()">Refresh</button><button class="secondary" onclick="downloadCSV()">Export CSV</button></div>
<div class="tablebox"><table><thead><tr><th>Date</th><th>Enrollment ID</th><th>Student</th><th>WhatsApp</th><th>Email</th><th>Country</th><th>University</th><th>Year</th><th>Status</th><th>Payment</th><th>Razorpay Payment ID</th><th>Order ID</th></tr></thead><tbody id="tbody"></tbody></table><div id="empty" class="empty" style="display:none">No enrollments found.</div></div>
</div>
<script>
let rows=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api/admin/enrollments',{credentials:'same-origin'});if(!r.ok)throw new Error(r.status===401?'Admin authentication required.':('Server error '+r.status));const d=await r.json();rows=d.enrollments||[];document.getElementById('total').textContent=d.stats.total;document.getElementById('confirmed').textContent=d.stats.confirmed;document.getElementById('pending').textContent=d.stats.pending;document.getElementById('captured').textContent=d.stats.captured;document.getElementById('updated').textContent='Updated '+new Date().toLocaleString();render();document.getElementById('error').style.display='none'}catch(e){const el=document.getElementById('error');el.textContent=e.message;el.style.display='block'}}
function render(){const q=document.getElementById('search').value.toLowerCase().trim(), st=document.getElementById('status').value;const out=rows.filter(x=>(!st||x.status===st)&&(!q||[x.enrollment_id,x.name,x.whatsapp,x.email,x.university,x.country,x.razorpay_payment_id,x.razorpay_order_id].join(' ').toLowerCase().includes(q)));document.getElementById('empty').style.display=out.length?'none':'block';document.getElementById('tbody').innerHTML=out.map(x=>`<tr><td>${esc(new Date(x.created_at).toLocaleString())}</td><td><strong>${esc(x.enrollment_id)}</strong></td><td>${esc(x.name)}</td><td>${esc(x.whatsapp)}</td><td>${esc(x.email)}</td><td>${esc(x.country)}</td><td>${esc(x.university)}</td><td>${esc(x.year)}</td><td><span class="status ${esc(x.status)}">${esc(x.status)}</span></td><td>${esc(x.payment_status)}</td><td>${esc(x.razorpay_payment_id||'—')}</td><td>${esc(x.razorpay_order_id||'—')}</td></tr>`).join('')}
function downloadCSV(){const q=document.getElementById('search').value.toLowerCase().trim(),st=document.getElementById('status').value;const out=rows.filter(x=>(!st||x.status===st)&&(!q||[x.enrollment_id,x.name,x.whatsapp,x.email,x.university,x.country,x.razorpay_payment_id,x.razorpay_order_id].join(' ').toLowerCase().includes(q)));const cols=['created_at','enrollment_id','status','name','whatsapp','email','country','university','year','razorpay_order_id','razorpay_payment_id','payment_status'];const csv=[cols.join(','),...out.map(x=>cols.map(k=>'"'+String(x[k]??'').replaceAll('"','""')+'"').join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='doctors-query-fmge-enrollments.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.getElementById('search').addEventListener('input',render);document.getElementById('status').addEventListener('change',render);load();
</script>
</body></html>
